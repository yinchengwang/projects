# wiki 门禁 CI
#
# 只验证「wiki 文档与工装」，不参与 C/C++ 构建。四个 job：
#   wiki-lint      结构门禁（六个必含章节 + 条件章节 + front-matter 键）
#   wiki-manifest  manifest 与机制的契约一致性
#   wiki-refs      引用门禁（符号必须在 refs 声明的文件里真实出现）
#   wiki-tests     工装层的单元测试
#
# 路径说明（2026-11-23 实测）：
#   `docs/wiki/` 根下还有 `wiki-schema.md`（契约文档，无 front-matter）、
#   `p2-pilot-report.md`、`p3-full-report.md`、`p3-review-*.md`（报告，不是机制页）。
#   这些文件会被 wiki_lint 判 FAIL，所以门禁范围必须是 `docs/wiki/projects`
#   —— 即「页面树」，不含契约文档与报告。
#
# 本 workflow 位于 projects 仓的 .github/workflows/，所有 run 的工作目录天然就是
# **projects 仓根**，因此**不要写 `working-directory: projects`** —— 那是顶层
# 聚合仓 `C:\code` 的相对写法，在子仓里会变成不存在的 `projects/projects`。
#
# refs 门禁需要各库的本地源码。CI 里没有 `.cache/repos/<lib>`，所以先由
# repo_cache.ensure_repo 检出，再跑 refs。clone 失败即 job 失败并打印库名，
# 不静默跳过。
#
# **检出方式：全量克隆（partial clone，blob 按需下载）**。
# 浅克隆（--depth 1）只有 1 个 commit、0 个 tag，机制盘点时无法对着历史版本
# 核验 refs；全量克隆保留完整提交历史与全部 tag，blob 在需要时才拉取。
# 实测（2026-11-25）：postgres 107528 commits / 701 tags / 144 MB，
# redis 21183 commits / 427 tags / 220 MB，sqlite 37694 commits / 392 tags / 590 MB。
# mysql-server 的历史更大（100 万+ commit），partial clone 耗时显著更长。

name: wiki

on:
  push:
    branches: [main, project]
    paths:
      - "docs/wiki/**"
      - "scripts/wiki/**"
      - "apps/wiki-rag/**"
      - ".github/workflows/wiki.yml"
  pull_request:
    branches: [main, project]
    paths:
      - "docs/wiki/**"
      - "scripts/wiki/**"
      - "apps/wiki-rag/**"
      - ".github/workflows/wiki.yml"

jobs:
  # ============ 结构门禁：六个必含章节 + 条件章节 + front-matter ============
  wiki-lint:
    name: Wiki 结构门禁
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 门禁脚本只用标准库，不装任何第三方包。
      - name: 结构门禁
        run: python scripts/wiki/wiki_lint.py docs/wiki/projects --quiet

  # ============ manifest 门禁 ============
  wiki-manifest:
    name: Wiki manifest 门禁
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 四个库各有一份清单，逐一过门禁。
      - name: manifest 门禁
        run: |
          # 遍历所有已产出机制 wiki 的项目目录，逐个校验 manifest 与机制页的一致性。
          found=0
          for m in docs/wiki/projects/*/_manifest.yml; do
            [ -e "$m" ] || continue
            found=$((found+1))
            python scripts/wiki/wiki_manifest_lint.py "$m" || exit 1
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::没有找到任何 _manifest.yml"
            exit 1
          fi
          echo "manifest 门禁覆盖 $found 个项目"

  # ============ 引用门禁（需要各库源码）============
  wiki-refs:
    name: Wiki 引用门禁
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lib:
          - name: postgres
            url: https://github.com/postgres/postgres
          - name: redis
            url: https://github.com/redis/redis
          - name: sqlite
            url: https://github.com/sqlite/sqlite
          - name: mysql-server
            url: https://github.com/mysql/mysql-server
          - name: langchain
            url: https://github.com/langchain-ai/langchain
          - name: llama-index
            url: https://github.com/run-llama/llama_index
          - name: haystack
            url: https://github.com/deepset-ai/haystack
          - name: lightrag
            url: https://github.com/HKUDS/LightRAG
          - name: graphrag
            url: https://github.com/microsoft/graphrag
          - name: ragas
            url: https://github.com/explodinggradients/ragas
          - name: ragflow
            url: https://github.com/infiniflow/ragflow
          - name: dify
            url: https://github.com/langgenius/dify
          - name: langgraph
            url: https://github.com/langchain-ai/langgraph
          - name: autogen
            url: https://github.com/microsoft/autogen
          - name: crewai
            url: https://github.com/crewAIInc/crewAI
          - name: metagpt
            url: https://github.com/FoundationAgents/MetaGPT
          - name: openai-agents
            url: https://github.com/openai/openai-agents-python
          - name: pydantic-ai
            url: https://github.com/pydantic/pydantic-ai
          - name: smolagents
            url: https://github.com/huggingface/smolagents
          - name: mcp-python-sdk
            url: https://github.com/modelcontextprotocol/python-sdk
          - name: browser-use
            url: https://github.com/browser-use/browser-use
          - name: openhands
            url: https://github.com/All-Hands-AI/OpenHands
          - name: goose
            url: https://github.com/block/goose
          - name: open-interpreter
            url: https://github.com/OpenInterpreter/open-interpreter
          - name: vllm
            url: https://github.com/vllm-project/vllm
          - name: sglang
            url: https://github.com/sgl-project/sglang
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 缓存键用库名 + 仓内记录的 refs 锚点提交；换 checkout 时需手动改键，
      # 避免用到旧源码导致 refs 误判。
      - name: 缓存源码检出
        uses: actions/cache@v4
        with:
          path: .cache/repos/${{ matrix.lib.name }}
          key: wiki-repo-${{ matrix.lib.name }}-${{ github.sha }}

      # 全量克隆（partial clone）：保留完整提交历史与全部 tag，blob 按需下载。
      # 浅克隆只剩 1 个 commit、0 个 tag，机制盘点无法对着历史版本核验 refs。
      - name: 全量克隆 ${{ matrix.lib.name }}
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts/wiki'); from repo_cache import ensure_repo; print(ensure_repo('${{ matrix.lib.url }}', '${{ matrix.lib.name }}', full=True))" || {
            echo "::error::全量克隆 ${{ matrix.lib.name }} 失败（refs 门禁需要该库源码）"
            exit 1
          }

      - name: 检出工作树
        run: git -C ".cache/repos/${{ matrix.lib.name }}" reset --hard HEAD

      - name: 引用门禁
        run: |
          python scripts/wiki/wiki_refs.py \
            --repo-root ".cache/repos/${{ matrix.lib.name }}" \
            "docs/wiki/projects/${{ matrix.lib.name }}" \
            --quiet

  # ============ 工装测试 ============
  wiki-tests:
    name: Wiki 工装测试
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 工装单元测试
        run: python -m unittest discover -s scripts/wiki -p "test_*.py" -v
