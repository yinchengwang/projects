<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>前端页面预览 · 合并应用</title>
  <style>
    :root{
      /* 与应用共用层同一套语言：石板蓝底 + 天蓝强调 */
      --bg:#0B1220; --panel:#131C2E; --panel2:#1B2740; --line:rgba(232,237,245,.12);
      --line-strong:rgba(232,237,245,.22);
      --fg:#E8EDF5; --dim:#A3B0C2; --muted:#8593A8;
      --acc:#38BDF8; --acc-soft:rgba(56,189,248,.14);
      --ok:#34D399; --warn:#FBBF24;
      --side-w:280px; --bar-h:52px;
      --ease:cubic-bezier(.4,0,.2,1); --dur:140ms;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;background:var(--bg);color:var(--fg);
      font:13.5px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      overflow:hidden;
    }
    :focus-visible{outline:2px solid var(--acc);outline-offset:2px}

    /* ---------- 顶栏 ---------- */
    .bar{
      height:var(--bar-h);display:flex;align-items:center;gap:10px;
      padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel);
      box-shadow:0 1px 3px rgba(0,0,0,.24);
    }
    .bar .title{font-weight:650;font-size:14px;margin-right:2px;white-space:nowrap;letter-spacing:-.01em}
    .bar .sp{flex:1}
    .url{
      flex:0 1 420px;min-width:120px;height:30px;display:flex;align-items:center;
      background:var(--bg);border:1px solid var(--line);border-radius:8px;
      padding:0 11px;color:var(--muted);font:12px/1 ui-monospace,Menlo,Consolas,monospace;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      transition:border-color var(--dur) var(--ease);
    }
    .url:hover{border-color:var(--line-strong)}
    .btn{
      height:30px;padding:0 12px;border:1px solid var(--line);border-radius:8px;
      background:var(--panel2);color:var(--fg);font-size:12.5px;cursor:pointer;
      display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
      font-family:inherit;
      transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease);
    }
    .btn:hover{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
    .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel2)}
    .seg button{
      height:30px;padding:0 11px;border:0;background:transparent;color:var(--muted);
      font-size:12.5px;cursor:pointer;font-family:inherit;border-right:1px solid var(--line);
      transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease);
    }
    .seg button:last-child{border-right:0}
    .seg button:hover{color:var(--fg)}
    .seg button.on{background:var(--acc);color:#0B1220;font-weight:600}

    /* ---------- 布局 ---------- */
    .layout{display:flex;height:calc(100% - var(--bar-h))}

    /* ---------- 侧栏 ---------- */
    .side{
      width:var(--side-w);flex:0 0 var(--side-w);border-right:1px solid var(--line);
      background:var(--panel);overflow-y:auto;padding:12px 0 32px;
    }
    .side h3{
      margin:0;padding:10px 16px 6px;font-size:11.5px;font-weight:650;
      color:var(--muted);text-transform:none;letter-spacing:.05em;
      display:flex;align-items:center;gap:8px;
    }
    .side h3 .n{
      font-size:10.5px;color:var(--muted);background:var(--panel2);
      border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-weight:500;
    }
    .side a{
      display:flex;align-items:center;gap:8px;padding:7px 14px 7px 20px;
      color:var(--fg);text-decoration:none;font-size:13px;border-left:2px solid transparent;
      transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease);
    }
    .side a:hover{background:var(--panel2)}
    .side a.on{background:var(--acc-soft);border-left-color:var(--acc);color:#fff;font-weight:600}
    .side a .d{color:var(--muted);font-size:11px;margin-left:auto;text-align:right;
      max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .side a.on .d{color:var(--acc)}

    /* ---------- 主舞台 ---------- */
    .stage{flex:1;min-width:0;display:flex;flex-direction:column;background:#080D18}
    .stage-inner{flex:1;min-width:0;display:flex;justify-content:center;overflow:auto;padding:0}
    #frame{
      width:100%;height:100%;border:0;background:#fff;display:block;
      transition:width .2s var(--ease);
    }
    .stage-inner.tablet #frame{width:820px;box-shadow:0 0 0 1px var(--line)}
    .stage-inner.phone  #frame{width:414px;box-shadow:0 0 0 1px var(--line)}

    /* ---------- 服务未启动时的提示 ---------- */
    .offline{
      display:none;margin:auto;max-width:520px;text-align:center;padding:32px;
    }
    .offline.show{display:block}
    .offline h2{font-size:17px;margin:0 0 10px;font-weight:650}
    .offline p{color:var(--dim);margin:0 0 16px}
    .offline code{
      display:inline-block;background:var(--panel2);border:1px solid var(--line);
      border-radius:8px;padding:10px 15px;font:12px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--acc);
    }
    .offline .err{color:var(--warn);font-size:12.5px;margin-top:14px}
  </style>
</head>
<body>
  <div class="bar">
    <span class="title">前端页面预览</span>
    <span class="url" id="url">—</span>
    <span class="sp"></span>
    <div class="seg" id="widths">
      <button data-w="full" class="on">自适应</button>
      <button data-w="tablet">平板 820</button>
      <button data-w="phone">手机 414</button>
    </div>
    <button class="btn" id="reload" title="重新加载当前页">↻ 刷新</button>
    <button class="btn" id="pop" title="在新标签页打开当前页">↗ 新标签</button>
  </div>

  <div class="layout">
    <nav class="side" id="side"></nav>
    <div class="stage">
      <div class="stage-inner" id="stageInner">
        <iframe id="frame" title="页面预览"></iframe>
      </div>
      <div class="offline" id="offline">
        <h2 id="offlineTitle">连不上应用服务</h2>
        <p id="offlineText">预览页要把真实应用嵌进来，所以应用本身得先跑着。</p>
        <code id="offlineCmd">node apps/web/server/main.js</code>
        <div class="err" id="offlineErr"></div>
        <div style="margin-top:18px"><a id="offlineLink" href="#" style="color:#38BDF8">改用这个地址打开 →</a></div>
      </div>
    </div>
  </div>

<script src="preview-manifest.js"></script>
<script>
"use strict"
;(function () {
  var side = document.getElementById("side")
  var frame = document.getElementById("frame")
  var urlBox = document.getElementById("url")
  var stageInner = document.getElementById("stageInner")
  var offline = document.getElementById("offline")
  var offlineErr = document.getElementById("offlineErr")

  // 页面清单来自 preview-manifest.js（静态副本，由 apps/web/preview/sync.js 生成）。
  // 用静态文件而不是接口，是为了让本页在 file:// 下也能用 —— 那时 fetch 会被 CORS 拦掉。
  var manifest = window.__PREVIEW_MANIFEST__ || []

  // 详情页要真实 id —— 从浏览器自己的 localStorage 里解析。
  // key 与 shared/workbench/keys.js 对应。
  var DETAIL_KEYS = {
    "/workbench/pages/tech/notes/detail": "db:tech_notes",
    "/workbench/pages/tech/snippets/detail": "db:snippets",
    "/workbench/pages/tech/interview/detail": "db:interview",
    "/trip/pages/detail": "db:trips"
  }

  // 各数据域的列表页 —— 访问它会触发 store 读，store 读不到就落 seed 数据。
  // 预览页要先把这些列表页在隐藏 iframe 里过一遍，localStorage 里才有 id 可用。
  var SEED_PAGES = {
    "db:tech_notes": "/workbench/pages/tech/notes/index",
    "db:snippets": "/workbench/pages/tech/snippets/index",
    "db:interview": "/workbench/pages/tech/interview/index"
  }

  var modules = []
  var current = null

  /** 当前应用基址：同源就用同源，file:// 打开则退回 5173 */
  function baseOrigin () {
    if (location.protocol === "file:") return "http://127.0.0.1:5173"
    return location.origin
  }

  /** 从 localStorage 里取某个数据域的第一个 id */
  function firstId (key) {
    try {
      var raw = localStorage.getItem(key)
      if (!raw) return ""
      var arr = JSON.parse(raw)
      if (arr && arr.length && arr[0] && arr[0].id) return arr[0].id
    } catch (e) {}
    return ""
  }

  /** 给页面算出最终 URL（含 query） */
  function urlFor (page) {
    var q = page.query || ""
    if (page.detail) {
      var key = DETAIL_KEYS[page.path]
      var id = key ? firstId(key) : ""
      if (id) q = "id=" + encodeURIComponent(id)
      else if (page.list) return baseOrigin() + page.list
    }
    return baseOrigin() + page.path + (q ? "?" + q : "")
  }

  /** 渲染侧栏 */
  function renderSide () {
    var html = []
    modules.forEach(function (m) {
      html.push('<h3>' + m.name + ' <span class="n">' + m.pages.length + '</span></h3>')
      m.pages.forEach(function (p) {
        html.push(
          '<a href="#" data-path="' + p.path + '"' + (p.desc ? ' title="' + p.desc + '"' : "") + '>' +
          '<span>' + p.title + '</span>' +
          (p.desc ? '<span class="d">' + p.desc + '</span>' : '') +
          '</a>'
        )
      })
    })
    side.innerHTML = html.join("")
    Array.prototype.forEach.call(side.querySelectorAll("a"), function (a) {
      a.addEventListener("click", function (ev) {
        ev.preventDefault()
        go(a.getAttribute("data-path"))
      })
    })
  }

  /** 标记当前项 */
  function markCurrent (path) {
    Array.prototype.forEach.call(side.querySelectorAll("a"), function (a) {
      a.classList.toggle("on", a.getAttribute("data-path") === path)
    })
  }

  /** 跳到某页 */
  function go (path) {
    var page = null
    modules.forEach(function (m) {
      m.pages.forEach(function (p) { if (p.path === path) page = p })
    })
    if (!page) return
    current = page
    var url = urlFor(page)
    urlBox.textContent = url.replace(baseOrigin(), "")
    markCurrent(path)
    if (location.hash !== "#" + path) location.hash = path
    frame.src = url
    offline.classList.remove("show")
  }

  // 顶栏按钮
  document.getElementById("reload").addEventListener("click", function () {
    if (frame.src) frame.src = frame.src
  })
  document.getElementById("pop").addEventListener("click", function () {
    if (frame.src) window.open(frame.src, "_blank")
  })
  Array.prototype.forEach.call(document.getElementById("widths").children, function (b) {
    b.addEventListener("click", function () {
      Array.prototype.forEach.call(document.getElementById("widths").children, function (x) { x.classList.remove("on") })
      b.classList.add("on")
      stageInner.classList.remove("tablet", "phone")
      if (b.getAttribute("data-w") !== "full") stageInner.classList.add(b.getAttribute("data-w"))
    })
  })

  // 浏览器前进后退
  window.addEventListener("hashchange", function () {
    var p = location.hash.replace(/^#/, "")
    if (p && p !== (current && current.path)) go(p)
  })

  // 详情页的 id 来自 localStorage，而 seed 数据是「第一次读 store 时」才落的。
  // 所以先把对应列表页在隐藏 iframe 里过一遍，等 seed 落完再解析 id。
  function ensureSeeds (done) {
    var need = []
    Object.keys(SEED_PAGES).forEach(function (key) {
      try { if (!localStorage.getItem(key)) need.push(key) } catch (e) { need.push(key) }
    })
    if (!need.length) { done(); return }

    var pending = need.length
    var timer = setTimeout(function () { finish() }, 3000)  // 兜底，别卡住
    var finished = false
    function finish () {
      if (finished) return
      finished = true
      clearTimeout(timer)
      done()
    }
    need.forEach(function (key) {
      var f = document.createElement("iframe")
      f.style.display = "none"
      f.src = baseOrigin() + SEED_PAGES[key]
      f.addEventListener("load", function () {
        pending -= 1
        if (pending <= 0) setTimeout(finish, 200)
      })
      document.body.appendChild(f)
    })
  }

  // 渲染目录树并进第一页
  function boot () {
    modules = manifest
    if (!modules.length) {
      showOffline("页面清单没加载到", "preview-manifest.js 可能缺失或没同步。", "node apps/web/preview/sync.js")
      return
    }
    renderSide()
    ensureSeeds(function () {
      var start = location.hash.replace(/^#/, "") || (modules[0] && modules[0].pages[0] && modules[0].pages[0].path)
      if (start) go(start)
      checkServer()
    })
  }

  // 探一下应用服务在不在 —— 决定要不要提示。
  // 用 no-cors 的 fetch：本页可能以 file:// 打开，那时 Origin 是 null，
  // 普通 fetch 会被 CORS 拦掉；no-cors 不需要响应头，但网络不通照样 reject。
  function checkServer () {
    fetch(baseOrigin() + "/style.css?_probe=" + Date.now(), { mode: "no-cors" }).then(function () {
      offline.classList.remove("show")
    }).catch(function () {
      showOffline("应用服务没起来", "预览页要把真实应用嵌进来，所以应用本身得先跑着。", "node apps/web/server/main.js")
    })
  }

  // 显示提示面板
  function showOffline (title, text, cmd) {
    document.getElementById("offlineTitle").textContent = title
    document.getElementById("offlineText").textContent = text
    document.getElementById("offlineCmd").textContent = cmd
    offlineErr.textContent = ""
    var link = document.getElementById("offlineLink")
    link.href = "http://127.0.0.1:5173/preview.html"
    link.style.display = location.protocol === "file:" ? "" : "none"
    offline.classList.add("show")
  }

  boot()
})()
</script>
</body>
</html>
