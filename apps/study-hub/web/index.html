<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学习中枢 · study-hub</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/diagnose.css" />
</head>
<body>
  <header class="topbar">
    <h1>学习中枢<span>算法 · 数据库 · AI 三轨 · 判题 · 间隔复习 · 能力诊断</span></h1>
    <nav id="tabs"></nav>
  </header>
  <main id="view">
    <div class="panel">正在加载…</div>
  </main>
  <!-- ui.js 先加载：公共界面构件（页头 / 主卡 / 数字块），页面脚本随后注册自己 -->
  <script src="/ui.js"></script>
  <!-- app.js 先加载：它把公共工具挂到 window.AlgoPlan 上，页面脚本随后注册自己 -->
  <script src="/app.js"></script>
  <!-- llm.js 自挂载：把「LLM 工作台」插到 #view 顶部，不改 app.js -->
  <script src="/llm.js"></script>
  <!-- charts.js 也要先加载：诊断页在注册时就取它的主题色 -->
  <script src="/charts.js"></script>
  <!-- session.js：会话队列式首页（P1 的主页面） -->
  <script src="/pages/session.js"></script>
  <!-- settings.js：会话设置页（会话长度 / 轨权重 / 次数阈值 / 环境自检） -->
  <script src="/pages/settings.js"></script>
  <!-- unit.js / library.js：单元页与单元库（P2） -->
  <script src="/pages/unit.js"></script>
  <script src="/pages/library.js"></script>
  <!-- P4 供给页 -->
  <script src="/pages/supply.js"></script>
  <!-- P3 起 today / review / rounds 三个旧页不再加载（文件保留在仓库里作为历史，契约 §9.1） -->
  <script src="/diagnose.js"></script>
</body>
</html>
